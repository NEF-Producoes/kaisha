# Kaisha · configuração do escritório
# Salve este arquivo e todos os navegadores abertos mudam na hora.
# As chaves podem ser em português ou em inglês (salas/rooms, agentes/agents, ...).
#
# Coordenadas em blocos de 16 px: [coluna, linha]. Cada sala ocupa
# [coluna, linha, largura, altura]; as 2 primeiras linhas da sala são parede.

nome: Minha Empresa
tema: auto            # auto = segue o calendário · natal, junina, ... · nenhum
formato: auto         # auto (o terreno acompanha a tela), "16:9", "21:9"… ou livre (só o prédio)
calendario: br

salas:
  # 30 × 16 blocos: com o terreno em volta, a tela fica exatamente 16:9
  - id: atendimento
    nome: Atendimento
    area: [0, 0, 15, 8]
    piso: madeira       # madeira, madeira_escura, carpete_azul, carpete_verde, ladrilho, xadrez
  - id: comercial
    nome: Comercial
    area: [15, 0, 15, 8]
    piso: carpete_azul
  - id: operacao
    nome: Operação
    area: [0, 8, 15, 8]
    piso: ladrilho
  - id: supervisao
    nome: Supervisão
    area: [15, 8, 15, 8]
    piso: xadrez

agentes:
  - id: atendimento
    nome: Aura
    cargo: Atendimento
    sala: atendimento
    mesa: [3, 3]          # mesa ocupa 2 blocos; o agente senta logo abaixo
    cor: laranja          # cor da roupa: vermelho, laranja, amarelo, verde, azul, roxo, rosa, cinza
  - id: triagem
    nome: Radar
    cargo: Classificação
    sala: atendimento
    mesa: [9, 3]
    cor: verde
  - id: vendas
    nome: Closer
    cargo: Comercial
    sala: comercial
    mesa: [18, 3]
    cor: azul
  - id: followup
    nome: Pulse
    cargo: Follow-up
    sala: comercial
    mesa: [24, 3]
    cor: roxo
  - id: agenda
    nome: Tempo
    cargo: Agenda
    sala: operacao
    mesa: [6, 11]
    cor: amarelo
  - id: supervisor
    nome: Atlas
    cargo: Supervisor
    sala: supervisao
    mesa: [22, 11]
    cor: cinza

moveis:
  - { tipo: relogio,   pos: [4, 0] }
  - { tipo: janela,    pos: [11, 0] }
  - { tipo: estante,   pos: [1, 2] }
  - { tipo: planta,    pos: [13, 6] }
  - { tipo: janela,    pos: [17, 0] }
  - { tipo: quadro,    pos: [25, 0] }
  - { tipo: planta,    pos: [15, 6] }
  - { tipo: planta,    pos: [28, 2] }
  - { tipo: bebedouro, pos: [1, 10] }
  - { tipo: cafe,      pos: [3, 10] }
  - { tipo: arquivo,   pos: [12, 10] }
  - { tipo: grafico,   pos: [25, 8] }
  - { tipo: sofa,      pos: [16, 13] }
  - { tipo: planta,    pos: [28, 13] }

datas_especiais:
  - { data: "03-15", nome: "Aniversário da empresa", mensagem: "Parabéns, equipe!" }
