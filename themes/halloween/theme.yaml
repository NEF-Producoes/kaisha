# Tema de Halloween (Dia das Bruxas) · aparece sozinho de 15 a 31 de outubro
nome: Halloween
titulo: "Feliz Dia das Bruxas! 🎃"
periodo: { de: "10-15", ate: "10-31" }
efeito: morcegos
floor_tint: "rgba(70,30,90,0.10)"

enfeites:
  - { sprite: bandeirolas, ponto: teto }                 # varal laranja e preto ao longo do topo
  - { sprite: teia, ponto: parede, cada: 5, offset: 1 }  # teia com aranha
  - { sprite: morcego, ponto: parede, cada: 7, offset: 4 }
  - { sprite: abobora, ponto: canto }                    # abóbora acesa num canto de cada sala
  - { sprite: vela, ponto: mesa }
  - { sprite: chapeu, ponto: cabeca }                    # chapéu de bruxa em todo mundo

